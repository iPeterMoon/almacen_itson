name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  servidor:
    name: Servidor (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: servidor/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npx tsc --noEmit -p tsconfig.json

      - name: Pruebas
        run: npm test -- --ci

      - name: Compilar
        run: npm run build

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze

      - name: Pruebas
        run: flutter test

  base-datos:
    name: Base de datos (migraciones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Aplica migraciones y seeds sobre la imagen real de Supabase (Postgres 17).
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Aplicar migraciones en Supabase local
        run: supabase db start

      - name: Detener Supabase local
        run: supabase stop --no-backup

      # Escenarios de las HU contra Postgres con el stub de Supabase.
      - name: Recrear base de pruebas
        run: bash supabase/pruebas/reiniciar.sh

      - name: Probar escenarios
        run: python3 supabase/pruebas/probar.py

  # Si el PR trae migraciones nuevas y todo lo anterior pasó, se aplican al
  # proyecto de pruebas de Supabase antes de aceptarlo. Al principal solo llegan
  # tras el merge (ver migraciones.yml).
  supabase-pruebas:
    name: Supabase pruebas (migraciones)
    needs: [servidor, app, base-datos]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: pruebas
    # Nunca dos aplicaciones a la vez ni se cancela una a medias.
    concurrency:
      group: supabase-pruebas
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar migraciones nuevas
        id: cambios
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations; then
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "El PR no trae migraciones nuevas."
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations
          fi

      - uses: supabase/setup-cli@v1
        if: steps.cambios.outputs.hay == 'true'
        with:
          version: 3.2.0

      - name: Vincular proyecto
        if: steps.cambios.outputs.hay == 'true'
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Migraciones pendientes
        if: steps.cambios.outputs.hay == 'true'
        run: supabase migration list --remote

      - name: Aplicar migraciones
        if: steps.cambios.outputs.hay == 'true'
        run: supabase db push --remote --yes
