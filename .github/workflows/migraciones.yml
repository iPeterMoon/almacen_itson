name: Migraciones

# Cuando el CI pasa en main (es decir, tras hacer merge de un PR aprobado) aplica
# las migraciones pendientes al proyecto principal de Supabase. Al de pruebas ya
# se aplicaron desde el PR (job "Supabase pruebas" de ci.yml).
# Sin migraciones pendientes no hace nada.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez ni se cancela uno a medias.
concurrency:
  group: migraciones
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  principal:
    name: Proyecto principal
    # Solo si el CI terminó bien en un push a main (o si se lanza a mano).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: principal
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # El commit que probó el CI, no el último de main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Vincular proyecto
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Migraciones pendientes
        run: supabase migration list --remote

      - name: Aplicar migraciones
        run: supabase db push --remote --yes
